<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>IPTV BURO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- AVPlay is rendered by the TV in a hardware layer behind this page. -->
    <object id="av-player" type="application/avplayer"></object>

    <div id="app" class="app-root">
        <div class="boot-screen">
            <div class="boot-backdrop local" aria-hidden="true">
                <div class="boot-cover-row boot-cover-row-a">
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="boot-cover-row boot-cover-row-b">
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
            <div class="boot-vignette" aria-hidden="true"></div>
            <section class="boot-panel" role="status" aria-live="polite" aria-atomic="true">
                <div class="boot-mark" aria-hidden="true"><span>B</span></div>
                <p class="boot-brand">IPTV BURO</p>
                <p class="boot-message">Preparando seus perfis&hellip;</p>
                <p class="boot-stage">PREPARANDO SUA BURO</p>
                <div class="boot-progress" role="progressbar" aria-label="Preparando seus perfis"
                     aria-valuemin="0" aria-valuemax="100" aria-valuenow="25">
                    <span class="boot-progress-fill" style="width: 25%"></span>
                    <strong class="boot-progress-value" aria-hidden="true">25%</strong>
                </div>
                <div class="boot-dots" aria-hidden="true">
                    <span class="boot-dot active"></span><span class="boot-dot"></span>
                    <span class="boot-dot"></span><span class="boot-dot"></span>
                </div>
            </section>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

    <div id="player-overlay" class="player-overlay" role="region" aria-labelledby="player-title" hidden>
        <div class="player-topbar">
            <span class="brand-small">B</span>
            <span class="player-heading">
                <strong id="player-title">IPTV BURO</strong>
                <small id="player-programme" hidden></small>
            </span>
        </div>
        <!-- O que vem a seguir quando um episodio termina. aria-live porque o
             painel aparece sozinho: um leitor de tela precisa anuncia-lo sem
             que nada tenha recebido foco. -->
        <!-- Pular a abertura. Nao recebe foco: as teclas sao tratadas direto,
             porque numa TV a pessoa ja tem o controle na mao e navegar ate um
             alvo custaria mais do que os trinta segundos que ele economiza. -->
        <button id="player-skip-intro" class="player-skip-intro" hidden></button>
        <!-- A moldura da previa do canal focado. Fica fora do overlay do player
             porque nao e uma reproducao: e uma janela ao lado da lista, e o
             overlay inteiro apareceria por cima dela. -->
        <div id="live-preview" class="live-preview" aria-hidden="true" hidden></div>
        <section id="player-next-panel" class="player-next-panel" role="status" aria-live="polite" hidden>
            <p id="player-next-title" class="player-next-title"></p>
            <p id="player-next-countdown" class="player-next-countdown"></p>
        </section>
        <div id="player-waiting" class="player-waiting" role="status" aria-live="polite" aria-atomic="true">
            <span class="boot-indicator" aria-hidden="true"></span>
            <p id="player-waiting-label">Carregando&hellip;</p>
        </div>
        <section id="player-error-panel" class="player-error-panel" role="alertdialog" aria-modal="true"
                 aria-labelledby="player-error-title" aria-describedby="player-error-message" hidden aria-live="assertive">
            <span class="empty-icon">!</span>
            <h2 id="player-error-title"></h2>
            <p id="player-error-message"></p>
            <div class="action-row">
                <button id="player-error-retry" class="button primary" data-player-error-action="retry"></button>
                <button id="player-error-back" class="button ghost" data-player-error-action="back"></button>
            </div>
        </section>
        <div id="player-subtitle-cue" class="player-subtitle-cue" hidden aria-live="off">
            <span id="player-subtitle-text"></span>
        </div>
        <div class="player-controls">
            <div class="player-status" id="player-status">Carregando&hellip;</div>
            <div id="player-timeline" class="player-timeline" role="progressbar" aria-valuemin="0"
                 aria-valuemax="100" aria-valuenow="0"><span id="player-progress"></span></div>
            <div class="player-control-row">
                <span id="player-elapsed">00:00</span>
                <span class="player-remote-actions"></span>
                <span id="player-duration">--:--</span>
            </div>
            <div id="player-action-bar" class="player-action-bar" role="toolbar">
                <button id="player-action-rewind" class="player-action-button" data-player-action="seek-back"></button>
                <button id="player-action-toggle" class="player-action-button primary" data-player-action="play-pause"></button>
                <button id="player-action-forward" class="player-action-button" data-player-action="seek-forward"></button>
                <button id="player-audio-label" class="player-action-button" data-player-action="audio"></button>
                <button id="player-subtitle-label" class="player-action-button" data-player-action="subtitles"></button>
                <button id="player-favorite-label" class="player-action-button tone-red" data-player-action="favorite" hidden></button>
                <button id="player-guide-label" class="player-action-button tone-green" data-player-action="guide" hidden></button>
                <button id="player-speed-label" class="player-action-button tone-yellow" data-player-action="speed" hidden></button>
                <button id="player-aspect-label" class="player-action-button tone-blue" data-player-action="aspect" hidden></button>
                <button id="player-action-sleep" class="player-action-button" data-player-action="sleep"></button>
                <button id="player-action-stats" class="player-action-button" data-player-action="stats"></button>
            </div>
            <div class="player-track-row">
                <!-- Aparece so quando o temporizador esta armado: um rotulo
                     permanente competiria com os que ensinam as teclas. -->
                <span id="player-sleep-label" hidden></span>
                <span id="player-lock-label">ENTER longo Bloquear controles</span>
                <span id="player-return-label">RETURN Voltar</span>
            </div>
        </div>
        <div id="player-lock-panel" class="player-lock-panel" role="status" aria-live="polite" hidden>
            <span class="player-lock-symbol" aria-hidden="true">L</span>
            <strong id="player-lock-title">Controles bloqueados</strong>
            <small id="player-lock-hint">Segure ENTER para desbloquear · RETURN para voltar</small>
        </div>
        <section id="player-menu" class="player-menu" role="dialog" aria-modal="true"
                 aria-labelledby="player-menu-title" hidden aria-live="polite">
            <span class="hero-kicker">IPTV BURO</span>
            <h2 id="player-menu-title"></h2>
            <div id="player-menu-options" class="player-menu-options"></div>
            <p id="player-menu-hint"></p>
        </section>
    </div>

    <section id="trailer-overlay" class="trailer-overlay" role="dialog" aria-modal="true"
             aria-labelledby="trailer-title" hidden aria-live="polite">
        <iframe id="trailer-frame" title="Trailer" src="about:blank"
                allow="autoplay; encrypted-media; fullscreen"
                sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
        <div class="trailer-shade" aria-hidden="true"></div>
        <header class="trailer-topbar"><span class="brand-small">B</span><strong id="trailer-title">IPTV BURO</strong></header>
        <footer class="trailer-controls">
            <p id="trailer-status"></p>
            <div id="trailer-timeline" class="trailer-timeline" role="progressbar" aria-valuemin="0"
                 aria-valuemax="100" aria-valuenow="0"><span id="trailer-progress"></span></div>
            <div class="trailer-time"><span id="trailer-elapsed">00:00</span><span id="trailer-duration">--:--</span></div>
            <p id="trailer-hint"></p>
        </footer>
    </section>

    <script src="js/keys.js"></script>
    <script src="js/domain.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/network.js"></script>
    <script src="js/m3u.js"></script>
    <script src="js/xmltv.js"></script>
    <script src="js/xtream.js"></script>
    <script src="js/display-quality.js"></script>
    <script src="js/tmdb.js"></script>
    <script src="js/critics.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/seasonal.js"></script>
    <script src="js/placeholder-artwork.js"></script>
    <script src="js/diagnostics.js"></script>
    <script src="js/providers.js"></script>
    <script src="js/service-index.js"></script>
    <script src="js/pairing.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/trailer.js"></script>
    <!-- Recomendação pública por QR: identidade/título, nunca stream ou credencial. -->
    <script src="js/qr.js"></script>
    <script src="js/share.js"></script>
    <!-- Sinopses/backdrops do Hero ficam somente numa fila/cache de sessão limitado. -->
    <script src="js/hero-enrichment.js"></script>
    <!-- Fila serial e retomável para completar fontes Xtream sem bloquear o shell. -->
    <script src="js/catalogue-sync.js"></script>
    <!-- Portal Stalker/Ministra: a sessão MAG fica apenas em memória e a UI informa limitações. -->
    <script src="js/stalker.js"></script>
    <script src="js/player.js"></script>
    <script src="js/playback-retry.js"></script>
    <!-- downloads.js depende de usb.js e domain.js: manter esta ordem. -->
    <script src="js/usb.js"></script>
    <script src="js/profile-photo.js"></script>
    <script src="js/artwork-cache.js"></script>
    <script src="js/downloads.js"></script>
    <!-- license.js depende de identity.js e network.js: manter esta ordem. -->
    <script src="js/identity.js"></script>
    <script src="js/license.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
