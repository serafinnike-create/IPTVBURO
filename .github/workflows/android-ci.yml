name: Android CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Verify
        run: ./gradlew test lint assembleDebug --stacktrace

      - name: Upload installable preview
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-BURO-android-debug
          path: apps/android-tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
