name: Android CI

on:
  push:
    branches: ["main", "agent/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Verify
        # Same explicit task list as preview-release.yml: a bare `test` runs every module —
        # including the desktop's Compose UI tests, which need a display and fail on a headless
        # Linux runner. Lint and the debug assemble stay covered through the android-tv tasks.
        run: ./gradlew :apps:android-tv:testDebugUnitTest :packages:domain-model:jvmTest :packages:metadata-client:test :apps:android-tv:lintDebug :apps:android-tv:assembleDebug --stacktrace
