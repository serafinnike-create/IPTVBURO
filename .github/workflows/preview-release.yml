name: Publish app preview

on:
  push:
    tags: ["v*-alpha.*", "v*-beta.*", "v*-rc.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build preview APK
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleDebug --stacktrace
          mkdir -p artifacts
          cp apps/android-tv/build/outputs/apk/debug/android-tv-debug.apk \
            "artifacts/IPTV-BURO-${RELEASE_TAG}-android-debug.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: preview-android
          path: artifacts/*.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows preview
        shell: pwsh
        run: |
          .\gradlew.bat :apps:desktop:test :apps:desktop:packageMsi --stacktrace
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $packages = @(
            Get-ChildItem `
              -LiteralPath apps\desktop\build\compose\binaries\main\msi `
              -Filter *.msi
          )
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSI package; found $($packages.Count)."
          }
          Copy-Item `
            -LiteralPath $packages[0].FullName `
            -Destination "artifacts\IPTV-BURO-$env:RELEASE_TAG-windows-x64.msi"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: preview-windows
          path: artifacts/*.msi
          if-no-files-found: error

  publish:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate preview tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "The release tag does not match the supported preview format." >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify packages and generate checksums
        shell: bash
        run: |
          mapfile -t apk_files < <(find artifacts -maxdepth 1 -type f -name '*.apk')
          mapfile -t msi_files < <(find artifacts -maxdepth 1 -type f -name '*.msi')
          if [[ "${#apk_files[@]}" -ne 1 || "${#msi_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK and one MSI." >&2
            exit 1
          fi
          sha256sum "${apk_files[0]}" "${msi_files[0]}" > artifacts/SHA256SUMS.txt

      - name: Publish complete preview release
        shell: bash
        env:
          APK_PATH: artifacts/IPTV-BURO-${{ inputs.tag || github.ref_name }}-android-debug.apk
          MSI_PATH: artifacts/IPTV-BURO-${{ inputs.tag || github.ref_name }}-windows-x64.msi
          SUM_PATH: artifacts/SHA256SUMS.txt
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$APK_PATH" "$MSI_PATH" "$SUM_PATH" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$APK_PATH" "$MSI_PATH" "$SUM_PATH" \
              --title "IPTV BURO $RELEASE_TAG" \
              --generate-notes \
              --prerelease \
              --verify-tag
          fi
