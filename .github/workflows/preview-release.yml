name: Publish app preview

on:
  push:
    # Final releases as well as previews. A tag like v4.0.0 carries no suffix, so the three
    # suffixed patterns never matched it and pushing one built nothing at all.
    #
    # These are globs, not regular expressions: `[0-9]` is a character class here but `+` would be
    # a literal plus sign, so the repetition has to be written out. The publish job validates the
    # exact shape with a real regex afterwards, which is what keeps a stray tag from shipping.
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"
      - "v*-rc.*"
      - "v[0-9].[0-9].[0-9]"
      - "v[0-9].[0-9].[0-9][0-9]"
      - "v[0-9].[0-9][0-9].[0-9]"
      - "v[0-9][0-9].[0-9].[0-9]"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build preview APK
        run: |
          chmod +x gradlew
          # This job builds the Android package, so it runs the Android module's tests and the
          # shared ones it depends on. A bare `test` runs every module — including the desktop's,
          # whose Compose UI tests need a display and fail on a headless Linux runner. The Windows
          # job runs those, on a machine that can actually draw them.
          ./gradlew :apps:android-tv:testDebugUnitTest :packages:domain-model:jvmTest :packages:metadata-client:test :apps:android-tv:lintDebug :apps:android-tv:assembleDebug --stacktrace
          mkdir -p artifacts
          cp apps/android-tv/build/outputs/apk/debug/android-tv-debug.apk \
            "artifacts/IPTV-BURO-${RELEASE_TAG}-android-debug.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: preview-android
          path: artifacts/*.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test clean Windows build
        shell: pwsh
        run: |
          .\gradlew.bat :apps:desktop:clean :apps:desktop:test --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed.' }

      - name: Build Windows preview
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $signingValues = @(
            $env:WINDOWS_SIGNING_CERTIFICATE_BASE64,
            $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD,
            $env:WINDOWS_TIMESTAMP_URL
          )
          $configuredSigningValues = @($signingValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($configuredSigningValues.Count -ne 0 -and $configuredSigningValues.Count -ne $signingValues.Count) {
            throw 'Windows signing secrets are only partially configured.'
          }
          $signedBuild = $configuredSigningValues.Count -eq $signingValues.Count

          if ($signedBuild) {
            $pfx = Join-Path $env:RUNNER_TEMP 'iptvburo-signing.pfx'
            [IO.File]::WriteAllBytes(
              $pfx,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            )
            $password = ConvertTo-SecureString `
              $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
              -AsPlainText `
              -Force
            $certificate = Import-PfxCertificate `
              -FilePath $pfx `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
            try {
              $env:IPTVBURO_WINDOWS_CERT_THUMBPRINT = $certificate.Thumbprint
              $env:IPTVBURO_TIMESTAMP_URL = $env:WINDOWS_TIMESTAMP_URL
              .\scripts\sign-windows-release.ps1
              if ($LASTEXITCODE -ne 0) { throw 'The signed Windows build failed.' }
            }
            finally {
              Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
              if ($null -ne $certificate) {
                Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
              }
            }
          }
          else {
            $env:IPTVBURO_ALLOW_UNSIGNED_WINDOWS_PREVIEW = 'true'
            .\gradlew.bat :apps:desktop:packageMsi --rerun-tasks --no-daemon --stacktrace
            if ($LASTEXITCODE -ne 0) { throw 'The unsigned Windows preview build failed.' }
          }

          # jpackage builds the MSI through a temporary image that is removed afterwards. Create a
          # stable app image for the privacy audit instead of relying on leftovers from another task.
          .\gradlew.bat :apps:desktop:createDistributable --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'The desktop audit image build failed.' }
          .\scripts\verify-clean-desktop-package.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The desktop privacy audit failed.' }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $packages = @(
            Get-ChildItem `
              -LiteralPath apps\desktop\build\compose\binaries\main\msi `
              -Filter *.msi
          )
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSI package; found $($packages.Count)."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $packages[0].FullName
          if ($signedBuild -and $signature.Status -ne 'Valid') {
            throw "The signed MSI signature is not valid: $($signature.Status)"
          }
          if (-not $signedBuild -and $signature.Status -ne 'NotSigned') {
            throw "The unsigned preview has an unexpected signature status: $($signature.Status)"
          }
          $suffix = if ($signedBuild) { '' } else { '-unsigned' }
          Copy-Item `
            -LiteralPath $packages[0].FullName `
            -Destination "artifacts\IPTV-BURO-$env:RELEASE_TAG-windows-x64$suffix.msi"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: preview-windows
          path: artifacts/*.msi
          if-no-files-found: error

  publish:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate preview tag
        shell: bash
        run: |
          # A preview (v1.2.3-rc.4) or a final release (v1.2.3), and nothing else.
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "The release tag does not match the supported format." >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify packages and generate checksums
        shell: bash
        run: |
          mapfile -t apk_files < <(find artifacts -maxdepth 1 -type f -name '*.apk')
          mapfile -t msi_files < <(find artifacts -maxdepth 1 -type f -name '*.msi')
          if [[ "${#apk_files[@]}" -ne 1 || "${#msi_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK and one MSI." >&2
            exit 1
          fi
          sha256sum "${apk_files[0]}" "${msi_files[0]}" > artifacts/SHA256SUMS.txt

      - name: Publish complete preview release
        shell: bash
        run: |
          APK_PATH="artifacts/IPTV-BURO-${RELEASE_TAG}-android-debug.apk"
          mapfile -t msi_files < <(find artifacts -maxdepth 1 -type f -name '*.msi')
          MSI_PATH="${msi_files[0]}"
          SUM_PATH="artifacts/SHA256SUMS.txt"
          if [[ "$MSI_PATH" == *-unsigned.msi ]]; then
            RELEASE_NOTES="Windows and Android packages. The MSI is not code-signed, so Windows may display an Unknown publisher or SmartScreen warning on install. The package passed the clean-data privacy audit."
          else
            RELEASE_NOTES="Signed Windows package and Android debug package."
          fi
          # A suffixed tag is a preview; a bare v1.2.3 is a final release and is published as one,
          # because marking a finished release "pre-release" tells everyone who downloads it that
          # it is not ready.
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc)\. ]]; then
            MATURITY_FLAG="--prerelease"
          else
            MATURITY_FLAG="--latest"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$APK_PATH" "$MSI_PATH" "$SUM_PATH" \
              --clobber
            gh release edit "$RELEASE_TAG" --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" \
              "$APK_PATH" "$MSI_PATH" "$SUM_PATH" \
              --title "IPTV BURO $RELEASE_TAG" \
              --notes "$RELEASE_NOTES" \
              $MATURITY_FLAG \
              --verify-tag
          fi
