name: Publish Android preview

on:
  push:
    tags: ["v*-alpha.*", "v*-beta.*", "v*-rc.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build preview APK
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleDebug --stacktrace
          mkdir -p artifacts
          cp apps/android-tv/build/outputs/apk/debug/android-tv-debug.apk \
            "artifacts/IPTV-BURO-${{ inputs.tag || github.ref_name }}-android-debug.apk"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.apk \
            --title "IPTV BURO $RELEASE_TAG" \
            --generate-notes \
            --prerelease
