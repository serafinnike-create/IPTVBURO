name: Publish activation site

on:
  push:
    # The preview branch is included so the activation page can go live before the
    # branch is merged; the app already points at the published URL.
    branches: [main, 'agent/iptv-buro-0.2-preview']
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# The presentation is static and carries no secrets. It validates only the public device-code shape,
# then hands checkout and activation to the Cloudflare Worker, which remains the payment authority.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
