name: Secret scan

# Mandatory gate assumed in docs/audits/SECURITY_LOGGING_AUDIT.md: no commit may
# introduce credentials, private keys, signed URLs or playlist secrets. Runs on the
# same branches as android-ci.yml.

on:
  push:
    branches: ["main", "agent/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        # Pinned to the v2 major of the official action. GITLEAKS_LICENSE is only
        # required for organizations; this is an individual OSS repository, so the
        # job deliberately does not configure (or require) a license token.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
